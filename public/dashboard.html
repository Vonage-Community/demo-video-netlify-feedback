<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">

  <!-- Netlify Identity Widget -->
  <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6e8efb">
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
</head>

<body>

  <header id="app-header" class="header-logged-out">
    <div class="header-nav">
      <h1 id="header-title">Feedback Dashboard</h1>
      <button id="auth-btn" class="primary-btn">Log In with GitHub</button>
    </div>

    <!-- Stats Banner (Hidden by default) -->
    <section id="stats-container" class="analytics-banner" style="display: none;">
      <!-- JS will inject stats here -->
    </section>
  </header>

  <main>
    <!-- Unauthenticated View -->
    <div id="unauth-view" class="unauth-view">
      <div class="welcome-card">
        <div class="welcome-icon">
          <svg viewBox="0 0 24 24" width="48" height="48" fill="none" aria-hidden="true">
            <rect x="3" y="3" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.5" />
            <path d="M8 21h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <path d="M12 16v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <circle cx="12" cy="9.5" r="2" stroke="currentColor" stroke-width="1.5" />
            <path d="M9 9.5a3 3 0 0 1 6 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
              opacity="0.5" />
          </svg>
        </div>
        <h2>Welcome, Speaker</h2>
        <p class="welcome-text">Log in to manage your workshop sessions, view attendee feedback, and generate QR codes
          for your slides.</p>
        <p id="error-message" class="error-message" style="display: none;"></p>
      </div>
    </div>

    <!-- Authenticated View -->
    <div id="dashboard-view" class="dashboard-view" style="display: none;">

      <!-- Floating Action Button -->
      <button id="setupFab" commandfor="createSessionDialog" command="show-modal" aria-label="Create Session">
        +
      </button>

      <!-- Create Session Dialog -->
      <dialog id="createSessionDialog">
        <button commandfor="createSessionDialog" command="close" aria-label="Close"
          class="close-dialog">&times;</button>
        <section>
          <h2>Create New Session</h2>
          <div class="input-group">
            <label for="session-title-input">Session Title</label>
            <input type="text" id="session-title-input" placeholder="e.g., Intro to WebXR">

            <label for="session-id-input" class="label-spaced">Session ID (URL Slug)</label>
            <input type="text" id="session-id-input" placeholder="e.g., intro-to-webxr">

            <button id="create-session-btn" class="primary-btn btn-spaced">Create Session</button>
          </div>
        </section>
      </dialog>

      <!-- QR Code Display Dialog -->
      <dialog id="qrDialog">
        <button commandfor="qrDialog" command="close" aria-label="Close" class="close-dialog">&times;</button>
        <section class="qr-dialog-content">
          <h2 id="qr-session-title">Session Link</h2>
          <p class="qr-url-label">Attendee URL:</p>
          <a id="feedback-link" href="#" target="_blank" class="qr-url-link"></a>
          <div id="qrcode" class="qr-code-container"></div>
          <button id="download-qr-btn" class="secondary-btn">Download QR for Slides</button>
        </section>
      </dialog>

      <!-- Feedback List -->
      <section class="feedback-section">
        <div id="feedback-list">
          <!-- JS will inject feedback items here -->
        </div>
      </section>

    </div>
  </main>

  <script type="module" src="dashboard.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then((registration) => {
            console.log('ServiceWorker registered successfully with scope: ', registration.scope);
          })
          .catch((error) => {
            console.error('ServiceWorker registration failed: ', error);
          });
      });
    }
  </script>
</body>

</html>
